name = "blockinghamfc"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Baked in here so these survive every redeploy from GitHub — Cloudflare
# reads this file as the source of truth each time it builds from the repo,
# so bindings added only via the dashboard get wiped out on the next push.

[[kv_namespaces]]
binding = "POSTS"
id = "535c639b6cf1415da3e7b2fee5910118"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "blockingham-images"

# ADMIN_PASSWORD and WHATSAPP_LINK stay as dashboard-only environment
# variables (Settings -> Variables and Bindings) rather than in this file,
# so they don't end up sitting in plain text in your public GitHub repo.
# Those two should NOT get wiped on redeploy since they're plain env vars,
# not bindings tied to wrangler.toml — but if they ever do vanish too,
# just re-add them the same way as before.
